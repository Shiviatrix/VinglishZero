name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Verify
        run: cargo run -p vz-cli -- verify
      - name: Validate
        run: cargo run -p vz-cli -- validate
      - name: Benchmark
        run: cargo run -p vz-cli -- benchmark
