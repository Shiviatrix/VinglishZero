name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Frontend prerequisites
        run: |
          python3 --version
          javac -version
          clang --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Verify
        run: cargo run --locked -p vz-cli -- verify
      - name: Validate
        run: cargo run --locked -p vz-cli -- validate
      - name: Benchmark
        run: cargo run --locked -p vz-cli -- benchmark
